version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # A string de conexão será passada via arquivo .env na sua VPS
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://app.soraiababy.com.br
    volumes:
      - uploads:/app/uploads
    ports:
      # Expondo na porta local 3030 da VPS para o Nginx fazer o Proxy Pass
      - "127.0.0.1:3030:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passando a URL do backend em tempo de build para o frontend
        VITE_API_URL: https://api.soraiababy.com.br
    restart: unless-stopped
    ports:
      # Expondo na porta local 8080 da VPS para o Nginx fazer o Proxy Pass
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  uploads:
