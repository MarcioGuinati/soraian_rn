version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soraia_admin
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: soraia_db
    volumes:
      - soraia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soraia_admin -d soraia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Conecta ao banco de dados interno do Docker
      DATABASE_URL: postgresql://soraia_admin:${DB_PASS}@db:5432/soraia_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://app.soraiababy.com.br
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    volumes:
      - uploads:/app/uploads
    ports:
      # Expondo na porta local 3030 da VPS para o Nginx fazer o Proxy Pass
      - "127.0.0.1:3030:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passando a URL do backend em tempo de build para o frontend
        VITE_API_URL: https://api.soraiababy.com.br/api
    restart: unless-stopped
    ports:
      # Expondo na porta local 8080 da VPS para o Nginx fazer o Proxy Pass
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  soraia_pgdata:
  uploads:
